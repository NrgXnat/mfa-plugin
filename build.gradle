buildscript {
    ext {
        vXnat    = "1.11.0-SNAPSHOT"   // jakarta / Tomcat 10 line
    }
}

plugins {
    id "eclipse"
    id "idea"
    id "java-library"
    id "maven-publish"
    id "com.palantir.git-version" version "3.0.0"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
    id "io.spring.dependency-management" version "1.1.7"
}

group "com.radiologics"
version "1.6.0-SNAPSHOT"
description "XNAT Multi-Factor Authentication plugin"

repositories {
    // Scope mavenLocal to org.nrg.* so a locally-published SNAPSHOT of core is consumed without shadowing
    // partial third-party artifacts (e.g. ehcache-*-jakarta classifiers). See migration guide.
    mavenLocal { content { includeGroupByRegex 'org\\.nrg.*' } }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.nrg:parent:${vXnat}"
    }
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

java {
    // toolchain (not sourceCompatibility) so the build works on any default JDK — matches container-service.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

configurations {
    implementation.extendsFrom(implementAndInclude)
}

// Exclude legacy transitive deps no longer resolvable (Sun commercial jars,
// pre-2007 artifacts) brought in by log4j 1.x and similar. See monorepo
// xnat-web/build.gradle for the full pattern.
configurations.all {
    exclude group: 'com.sun.jdmk',        module: 'jmxtools'
    exclude group: 'com.sun.jmx',         module: 'jmxri'
    exclude group: 'javax.jms',           module: 'jms'
    exclude group: 'javax.sql',           module: 'jdbc-stdext'
    exclude group: 'javax.transaction',   module: 'jta'
}

dependencies {
    api platform("org.nrg:parent:${vXnat}")
    implementation platform("org.nrg:parent:${vXnat}")

    // Provided by XNAT at runtime.
    compileOnly "org.nrg.xnat:web"
    compileOnly "org.nrg.xdat:core"
    // xnat-data-models merged into org.nrg.xnat:web in 1.11.0 (guide §3) -> removed.
    compileOnly "org.nrg:prefs"
    compileOnly "org.nrg:mail"
    compileOnly "org.nrg:framework"
    compileOnly "org.springframework.security:spring-security-web"
    compileOnly "org.springframework.security:spring-security-config"
    compileOnly "org.springframework:spring-tx"
    compileOnly "org.springframework:spring-web"
    compileOnly "org.springframework:spring-webmvc"
    compileOnly "org.springframework:spring-context"
    compileOnly "com.fasterxml.jackson.core:jackson-databind"
    compileOnly "com.fasterxml.jackson.core:jackson-annotations"

    // 1.11.0 coordinate renames: turbine:turbine -> org.apache.turbine:turbine (7.0),
    // org.apache.velocity:velocity -> org.apache.velocity:velocity-engine-core (2.4.1)
    compileOnly "org.apache.turbine:turbine"
    compileOnly "org.apache.velocity:velocity-engine-core"

    // jakarta APIs (javax.* -> jakarta.* in source): servlet (filter/api), persistence (entity), mail (api).
    compileOnly "jakarta.servlet:jakarta.servlet-api"
    compileOnly "jakarta.persistence:jakarta.persistence-api"
    compileOnly "jakarta.mail:jakarta.mail-api"

    // springfox is dead on Spring 6; source only uses io.swagger.annotations.* -> provide those directly.
    compileOnly "io.swagger:swagger-annotations:1.5.20"

    // AWS SNS for SMS delivery: not provided by XNAT core (kept off the bundle, as in the original).
    compileOnly "com.amazonaws:aws-java-sdk-sns:1.11.901"
    compileOnly "com.amazonaws:aws-java-sdk-core:1.11.901"

    // OTP generator for Google Authenticator — bundled into the plugin jar.
    implementAndInclude "org.jboss.aerogear:aerogear-otp-java:1.0.0"
}

// Pulls in the Jenkins BUILD_NUMBER environment variable if available.
def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: "Manual"
def isDirty, branchName, gitHash, gitHashFull, commitDistance, lastTag, isCleanTag

try {
    def gitDetails = versionDetails()
    isDirty = gitVersion().endsWith ".dirty"
    branchName = gitDetails.branchName ?: "Unknown"
    gitHash = gitDetails.gitHash
    gitHashFull = gitDetails.gitHashFull
    commitDistance = gitDetails.commitDistance
    lastTag = gitDetails.lastTag
    isCleanTag = gitDetails.isCleanTag
} catch (IllegalArgumentException ignored) {
    logger.info "Got an error trying to read VCS metadata from git. It's possible this project is not under VCS control. Using placeholder values for manifest entries."
    isDirty = true
    branchName = "Unknown"
    gitHash = "None"
    gitHashFull = "None"
    commitDistance = 0
    lastTag = "None"
    isCleanTag = false
}

compileJava {
    dependsOn xnatDataBuilder
    options.fork = true   // a cross-JDK toolchain (21) must fork
    // Spring 6 no longer recovers method parameter names from bytecode; the xapi @RestController's
    // @RequestParam/@PathVariable args resolve only when compiled with -parameters.
    options.compilerArgs << '-parameters'
}

jar {
    doLast {
        if (!gradle.taskGraph.hasTask(":xnatPluginJar")) {
            logger.warn "WARNING: You should generally run xnatPluginJar instead of jar task for this plugin"
        }
    }
}

tasks.register("xnatPluginJar", Jar) {
    zip64 true
    archiveClassifier = "xpl"
    from {
        configurations.implementAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Application-Name": project.description,
                "Build-Date": buildDate,
                "Build-Number": buildNumber,
                "Implementation-Version": project.version,
                "Implementation-Sha": gitHash,
                "Implementation-Sha-Full": gitHashFull,
                "Implementation-Commit": commitDistance,
                "Implementation-LastTag": lastTag,
                "Implementation-Branch": branchName,
                "Implementation-CleanTag": isCleanTag,
                "Implementation-Dirty": isDirty
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            versionMapping {
                usage("java-api") {
                    fromResolutionOf("runtimeClasspath")
                }
                usage("java-runtime") {
                    fromResolutionResult()
                }
            }
            pom {
                name = "Radiologics MFA Plugin"
                description = "Plugin to enable Multi Factor Authentication (MFA)"
                developers {
                    developer {
                        id = "James_Ransford"
                        name = "James Ransford"
                        email = "ransfordj@radiologics.com"
                    }
                    developer {
                        id = "mohana_radiologics"
                        name = "Mohana Ramaratnam"
                        email = "mohana@radiologics.com"
                    }
                    developer {
                        id = "rickherrick_fw"
                        name = "Rick Herrick"
                        email = "rickherrick@flywheel.io"
                    }
                }
                scm {
                    connection = "scm:git:git://bitbucket.org/radiologics/mfa_plugin.git"
                    developerConnection = "scm:git:ssh://bitbucket.org/radiologics/mfa.git"
                    url = "https://bitbucket.org/radiologics/mfa_plugin"
                }
            }
        }
    }
    repositories {
        maven {
            name = "XNAT_Artifactory"
            url = project.version.toString().endsWith("-SNAPSHOT")
                ? "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local"
                : "https://nrgxnat.jfrog.io/nrgxnat/libs-release-local"
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars (Gradle maps
            // these to project properties). Local devs can set artifactoryUser/Token in
            // ~/.gradle/gradle.properties. Mirrors monorepo's buildSrc convention.
            credentials {
                username = (project.findProperty("artifactoryUser")  ?: System.getenv("ARTIFACTORY_USER"))  ?: ""
                password = (project.findProperty("artifactoryToken") ?: System.getenv("ARTIFACTORY_TOKEN")) ?: ""
            }
        }
    }
}


