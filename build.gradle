import org.gradle.internal.jvm.Jvm

group 'com.radiologics'
version '1.3.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'eclipse'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'io.franzbecker.gradle-lombok'

buildscript {
    ext {
        vXnat    = "1.8.8"
    }
    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
        mavenLocal()
        maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
        maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
        mavenCentral()
    }
    dependencies {
        classpath "io.spring.gradle:dependency-management-plugin:1.0.6.RELEASE"
	    classpath "io.franzbecker:gradle-lombok:4.0.0"
    }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenLocal()
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'build/xnat-generated/src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'build/xnat-generated/src/main/resources'
        }
    }
}
dependencyManagement.imports {
    mavenBom "org.nrg:parent:${vXnat}"
}
configurations {
    compile.extendsFrom(compileAndInclude)
}
dependencies {
    annotationProcessor "org.nrg:framework"
    implementation ("org.nrg.xnat:web"){
        exclude group: '*'
    }
    
    implementation ("org.nrg.xdat:core"){
        exclude group: '*'
    }

    implementation "org.nrg.xnat:xnat-data-models"
    implementation "org.nrg:prefs"
    implementation "org.nrg:mail"
    implementation "org.springframework.security:spring-security-web"
    implementation "org.springframework.security:spring-security-config"
    implementation "org.springframework:spring-tx"
    implementation "io.springfox:springfox-swagger2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.6.5"
    
    
    compile group: 'com.amazonaws', name: 'aws-java-sdk-sns', version: '1.11.901'
    compile group: 'com.amazonaws', name: 'aws-java-sdk-core', version: '1.11.901'
	
    compileAndInclude 'org.jboss.aerogear:aerogear-otp-java:1.0.0'
    implementation "org.nrg:framework"

    compile group: 'org.apache.turbine', name: 'turbine', version: '4.0-M1'
    compile group: 'org.apache.velocity', name: 'velocity', version: '1.7'
}

task fatJar(type: Jar) {
    zip64 true
    classifier = ""
    from {
        configurations.compileAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'mfa_plugin'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'Radiologics MFA Plugin'
                description = 'Plugin to enable Multi Factor Authentication (MFA)'
                developers {
                    developer {
                        id = 'James_Ransford'
                        name = 'James Ransford'
                        email = 'ransfordj@radiologics.com'
                    }
                    developer {
                        id = 'mohana_radiologics'
                        name = 'Mohana Ramaratnam'
                        email = 'mohana@radiologics.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://bitbucket.org/radiologics/mfa_plugin.git'
                    developerConnection = 'scm:git:ssh://bitbucket.org/radiologics/mfa.git'
                    url = 'https://bitbucket.org/radiologics/mfa_plugin'
                }
            }
        }
    }
}


