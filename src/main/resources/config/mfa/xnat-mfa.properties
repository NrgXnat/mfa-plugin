mfa.preferred=GoogleAuthenticator
mfa.redirectPath=/app/template/Index.vm
mfa.errorPath=/app/template/MfaVerificationError.vm
mfa.googleAuthenticator.qrCodeUrlTemplate=otpauth://totp/MFA_ISSUER:MFA_USERNAME?secret=MFA_SECRET&issuer=MFA_ISSUER
mfa.googleAuthenticator.verificationPath=/app/template/MfaGoogleAuthenticatorVerification.vm
mfa.googleAuthenticator.registerPath=/app/template/MfaGoogleAuthenticatorRegister.vm
mfa.email.verificationPath=/app/template/MfaEmailVerification.vm
mfa.email.codeSentTextTemplate=/screens/OTPCodeSentByEmail.vm
mfa.email.adminAlertTextTemplate=/screens/adminAlertEmail.vm
mfa.sms.verificationPath=/app/template/MfaSMSVerification.vm
mfa.sms.codeSentTextTemplate=/screens/OTPCodeSentBySMS.vm
# The pages XNAT's own XnatExpiredPasswordFilter allows while a password change is pending. The MFA filter has to allow
# the same set, or the two filters redirect each other's pages and neither the password change nor MFA can finish.
# These must match the values set on that filter in XNAT's SecurityConfig.
mfa.changePasswordPath=/app/template/XDATScreen_UpdateUser.vm
mfa.changePasswordAction=/app/action/ModifyPassword
mfa.loginPath=/app/template/Login.vm
mfa.loginAction=/app/action/XDATLoginUser
mfa.logoutAction=/app/action/LogoutUser
