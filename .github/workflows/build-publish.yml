name: Build and Publish

# Thin caller around the shared reusable workflow in
# NrgXnat/xnat-ci-workflows. Plugin variant — no GHCR Docker image
# (plugins ship a jar to JFrog only).

on:
  push:
    branches:
      - main
      - develop
      - 'releases/*'   # RC / release branches, e.g. releases/1.6.0-rc
  # Build and test pull requests against those branches too, so a change is checked before it is merged rather
  # than on the merge commit that also publishes it. Nothing is published for a pull request: publish-jfrog below
  # is false for any event that isn't a push.
  pull_request:
    branches:
      - main
      - develop
      - 'releases/*'
  workflow_dispatch:
    inputs:
      publish_jfrog:
        description: 'Publish jar to JFrog Artifactory (nrgxnat)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # required by reusable workflow's publish-ghcr job (gated by if: inputs.publish-ghcr but parsed at startup)

jobs:
  build-publish:
    uses: NrgXnat/xnat-ci-workflows/.github/workflows/gradle-build-publish.yml@v1
    with:
      # ──── Artifact ────
      artifact-glob: 'build/libs/*.jar'
      artifact-name: 'mfa-plugin-jar'

      # ──── JFrog ────
      # On any push to a triggered branch: publish. On dispatch: only when publish_jfrog ticked. Never for a pull
      # request. This reads github.event.inputs rather than inputs because the inputs context exists only for
      # workflow_dispatch and workflow_call; naming it here fails the run at startup for any other event, before a
      # job can start. github.event.inputs is part of the event payload, so it is null rather than an error, and its
      # values are strings.
      publish-jfrog: ${{ github.event_name == 'push' || github.event.inputs.publish_jfrog == 'true' }}

      # publish-ghcr deliberately omitted — defaults to false in the reusable workflow.

    # secrets: inherit passes XNAT_ARTIFACTORY_USER/TOKEN (org-level) and
    # the auto-injected GITHUB_TOKEN through to the reusable workflow.
    secrets: inherit
